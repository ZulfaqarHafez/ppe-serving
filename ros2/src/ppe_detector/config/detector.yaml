ppe_detector:
  ros__parameters:
    # model_path defaults to share/ppe_detector/models/ppe_yolov8s_320_int8dyn.onnx
    input_size: 320
    intra_op_threads: 0      # 0 = ONNX Runtime default
    score_threshold: 0.25    # the site demo starts at 0.25; the original app used 0.5
    candidate_floor: 0.05
    iou_threshold: 0.7
    image_topic: camera/image_raw
    detections_topic: detections
    annotated_topic: detections/image
    publish_annotated: true
    image_queue_depth: 1
    image_reliability: reliable   # or best_effort; see README
