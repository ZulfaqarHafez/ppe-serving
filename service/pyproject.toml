[project]
name = "ppe-service"
version = "0.1.0"
description = "FastAPI and ONNX Runtime serving for the PPE detector (YOLOv8s, 320 px, int8 weights)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "uvloop",
    "httptools",
    "python-multipart",
    "onnxruntime",
    "numpy",
    "pillow",
    "prometheus-client",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe_service"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PT", "RET", "C4"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S310", "S311"]
"scripts/**" = ["S310", "S311"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"
# Starlette's TestClient suggests a successor to httpx; httpx is kept for now.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
