# metrics-server for the HPA, from its pinned release manifest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
patches:
  - target: {kind: Deployment, name: metrics-server, namespace: kube-system}
    patch: |
      # kind's kubelets serve self-signed certificates.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --metric-resolution=15s
      # Loaded with `kind load image-archive`; the node has no proxy settings.
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
