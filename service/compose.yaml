# Local stack: the service, Prometheus scraping it, Grafana with a provisioned
# dashboard. Ports are bound to 127.0.0.1 only.
#
#   docker compose up -d --build
#   open http://127.0.0.1:3000  (dashboard "PPE service", anonymous read-only)
#
# Behind a TLS-intercepting proxy, build the image first with the proxy's CA as
# a BuildKit secret (see Dockerfile); compose then reuses ppe-service:dev.
name: ppe

services:
  ppe-service:
    build: .
    image: ppe-service:dev
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PPE_LOG_LEVEL: INFO
    cpus: ${PPE_CPUS:-2}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s
    restart: unless-stopped

  prometheus:
    image: quay.io/prometheus/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [ppe-service]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      # Local demo only: anonymous read-only access, no sign-in form needed.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ppe-service.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
