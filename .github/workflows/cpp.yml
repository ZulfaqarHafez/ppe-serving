name: cpp

on:
  push:
    branches: [main]
    paths: ["cpp/**", ".github/workflows/cpp.yml"]
  pull_request:
    paths: ["cpp/**", ".github/workflows/cpp.yml"]

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cpp

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-test:
    name: build and test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [release-clang, release-gcc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache ONNX Runtime and the model (both checked by SHA-256 at configure)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/.cache
          key: cpp-deps-${{ hashFiles('cpp/cmake/*.cmake') }}
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build (warnings are errors)
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Unit, detector and CLI exit-code tests
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: ASan and UBSan (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/.cache
          key: cpp-deps-${{ hashFiles('cpp/cmake/*.cmake') }}
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Lower mmap randomisation (ASan's shadow memory needs it on Ubuntu 24.04 runners)
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build and test under the sanitizers
        run: make asan

  parity:
    name: parity with Python onnxruntime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/.cache
          key: cpp-deps-${{ hashFiles('cpp/cmake/*.cmake') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Ninja and the pinned Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          python -m pip install -r python/requirements.txt
      - name: Parity test (int8 model; CI does not build the optional fp32 model)
        run: make parity PYTHON=python
      - name: README tables match the committed results
        run: git checkout -- results && make readme-check PYTHON=python

  lint:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/.cache
          key: cpp-deps-${{ hashFiles('cpp/cmake/*.cmake') }}
      - name: Install Ninja, clang-format 18 and clang-tidy 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format-18 clang-tidy-18
      - name: clang-format check
        run: make format-check CLANG_FORMAT=clang-format-18
      - name: clang-tidy (warnings are errors)
        run: make tidy
