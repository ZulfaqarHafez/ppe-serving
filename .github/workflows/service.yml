name: service

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["service/**", ".github/workflows/service.yml"]
  pull_request:
    paths: ["service/**", ".github/workflows/service.yml"]

permissions:
  contents: read

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: service

env:
  UV_VERSION: "0.11.32"
  IMAGE: ppe-service:ci

jobs:
  lint-test:
    name: Lint, type check, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: ruff (lint and format)
        run: scripts/ci.sh lint
      - name: mypy --strict
        run: scripts/ci.sh typecheck
      - name: Lock files in sync
        run: scripts/ci.sh lock
      - name: Fetch the model (checksum verified)
        run: scripts/ci.sh model
      - name: Tests (unit, API, registry, parity)
        run: scripts/ci.sh test

  image:
    name: Image, container smoke test, k6 gate
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tools (k6, kubeconform, kubectl, actionlint; checksum verified)
        run: scripts/ci.sh tools
      - name: Build the image
        run: scripts/ci.sh image
      - name: Container smoke test
        run: scripts/ci.sh smoke
      - name: k6 gate (p95 under 1000 ms, errors under 1% at 2 users, 2 CPUs)
        run: scripts/ci.sh k6-gate

  manifests:
    name: Kubernetes manifests and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tools
        run: scripts/ci.sh tools
      - name: kustomize build and kubeconform
        run: scripts/ci.sh manifests
      - name: actionlint
        run: scripts/ci.sh actionlint

  release:
    name: Publish image to GHCR
    # Only for a v* tag, and only when the repository variable PUBLISH_IMAGE is "true".
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_IMAGE == 'true'
    needs: [lint-test, image, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ppe-service
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
